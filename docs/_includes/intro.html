<figure class="intro" data-step="1" aria-label="Animated overview of how AEGIS-MEDLINK works">
<svg class="scene" viewBox="0 0 760 270" role="img" aria-labelledby="intro-title">
<title id="intro-title">A watch sends the astronaut's heart rate to the spacecraft, AEGIS checks it, MEDLINK keeps the alert safe while the link to Earth is down, then delivers it and brings the doctors' reply back.</title>
<defs>
<symbol id="env" viewBox="0 0 24 16"><rect x="1" y="1" width="22" height="14" rx="2.5"/><path d="M2 2l10 7 10-7" fill="none"/></symbol>
</defs>
<!-- Astronaut with watch -->
<g class="astronaut">
<circle cx="92" cy="78" r="30" class="suit"/>
<rect x="74" y="66" width="36" height="22" rx="10" class="visor"/>
<rect x="58" y="112" width="68" height="96" rx="22" class="suit"/>
<rect x="118" y="132" width="44" height="16" rx="8" class="suit"/>
<rect x="150" y="128" width="20" height="24" rx="5" class="watch"/>
<path d="M155 141l3 0 2-4 3 8 2-4 3 0" class="watch-line"/>
<text x="92" y="236" text-anchor="middle" data-i18n="astronaut" class="label">Astronaut</text>
<text x="160" y="118" text-anchor="middle" class="bpm bpm-ok">72 bpm</text>
<text x="160" y="118" text-anchor="middle" class="bpm bpm-high">118 bpm</text>
</g>
<!-- BLE stream: watch to spacecraft -->
<g class="ble">
<circle cx="182" cy="140" r="4" class="ble-dot" style="animation-delay:0s"/>
<circle cx="182" cy="140" r="4" class="ble-dot" style="animation-delay:.4s"/>
<circle cx="182" cy="140" r="4" class="ble-dot" style="animation-delay:.8s"/>
<text x="216" y="126" text-anchor="middle" class="tiny">Bluetooth</text>
</g>
<!-- Spacecraft -->
<g class="ship">
<rect x="250" y="40" width="230" height="190" rx="14" class="ship-body"/>
<text x="266" y="62" data-i18n="spacecraft" class="label strong">Spacecraft</text>
<rect x="266" y="76" width="198" height="62" rx="10" class="aegis"/>
<text x="280" y="100" class="name">AEGIS</text>
<text x="280" y="120" data-i18n="noteOk" class="tiny aegis-note note-ok">checks health, works offline</text>
<text x="280" y="120" data-i18n="noteWarn" class="tiny aegis-note note-warn">⚠ heart rate unusual: alert</text>
<text x="280" y="120" data-i18n="noteOff" class="tiny aegis-note note-off">what to do now · reply ~40 min</text>
<text x="280" y="120" data-i18n="noteGood" class="tiny aegis-note note-good">✓ doctor's reply on screen</text>
<rect x="266" y="152" width="198" height="62" rx="10" class="medlink"/>
<text x="280" y="174" data-i18n="outbox" class="name">MEDLINK outbox</text>
<g class="queue">
<use href="#env" x="282" y="186" width="24" height="16" class="env q1"/>
<use href="#env" x="312" y="186" width="24" height="16" class="env q2"/>
<use href="#env" x="342" y="186" width="24" height="16" class="env q3"/>
</g>
<use href="#env" x="440" y="186" width="24" height="16" class="env send"/>
</g>
<!-- Link to Earth -->
<g class="link">
<path d="M480 194H600" class="link-line"/>
<path d="M524 180l20 28M544 180l-20 28" class="link-x"/>
<text x="540" y="226" text-anchor="middle" data-i18n="linkOk" class="tiny link-ok">space link</text>
<text x="540" y="226" text-anchor="middle" data-i18n="linkDown" class="tiny link-down">link down</text>
<text x="540" y="226" text-anchor="middle" data-i18n="linkShort" class="tiny link-short">short window</text>
</g>
<!-- Earth -->
<g class="earth">
<circle cx="668" cy="150" r="62" class="planet"/>
<path d="M630 128c14-8 26 2 34-6s22-4 26 8-10 16-22 14-22 10-30 2-16-10-8-18z" class="land"/>
<path d="M650 182c10-6 22 0 30-2s14 6 8 12-24 4-30-2z" class="land"/>
<text x="668" y="236" text-anchor="middle" data-i18n="earthDoctors" class="label">Earth doctors</text>
<use href="#env" x="600" y="186" width="24" height="16" class="env reply"/>
</g>
</svg>
<figcaption>
<div class="intro-caption" aria-live="polite"><b class="intro-num">1</b><span class="intro-text"></span></div>
<div class="intro-controls">
<button type="button" class="intro-prev" aria-label="Previous step">‹</button>
<div class="intro-dots"></div>
<button type="button" class="intro-next" aria-label="Next step">›</button>
<button type="button" class="intro-play" aria-label="Pause">❚❚</button>
</div>
</figcaption>
</figure>
