<!DOCTYPE html>
<html lang="en" dir="ltr" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <title>Crew Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="earth.css">
  <link rel="stylesheet" href="live.css">
</head>
<body data-level="normal">

  <!-- The whole astronaut watch lives in the left half of the screen -->
  <main class="watch">

    <header class="wbar">
      <div class="crew">CREW-01</div>
      <div class="link" id="link"><span class="dot"></span><span id="linkText">EARTH LINK: STANDBY</span></div>

      <!-- Level selector (simulator) -->
      <div class="levels" id="levels">
        <button class="lvl normal active" data-level="normal" title="Normal"></button>
        <button class="lvl low"    data-level="low"    title="Low"></button>
        <button class="lvl medium" data-level="medium" title="Medium"></button>
        <button class="lvl high"   data-level="high"   title="High"></button>
      </div>

      <div class="badge">SIMULATED</div>
    </header>

    <!-- HIGH level: countdown, accept / refuse, then contact Earth -->
    <section class="card emergency" id="emergency" data-state="counting" hidden>
      <div class="em-info">
        <h2 id="emTitle">HIGH ALERT</h2>
        <p class="em-text" id="emText"></p>
        <p class="em-hint" id="emHint"></p>
      </div>
      <div class="em-count" id="emCount">10</div>
      <div class="em-buttons" id="emButtons">
        <button class="em-btn accept" id="btnAccept" type="button">ACCEPT</button>
        <button class="em-btn refuse" id="btnRefuse" type="button">REFUSE</button>
      </div>
      <div class="em-bar" id="emBar"><div class="em-fill" id="emFill"></div></div>
    </section>

    <!-- Messages from Earth (prominent) -->
    <section class="card earth" id="earthBox" hidden>
      <h2>MESSAGE FROM EARTH</h2>
      <div id="earthList"></div>
    </section>

    <div class="cols">

      <!-- Column 1: live readings + note -->
      <section class="col">

        <section class="card pulse">
          <div class="pulse-row">
            <div class="pulse-main">
              <h2>PULSE</h2>
              <div class="big"><span id="hr">72</span><small>BPM</small></div>
            </div>
            <div class="pulse-side">
              <span class="status" id="status">● NORMAL</span>
              <p class="sub">YOUR NORMAL: 72</p>
            </div>
          </div>
          <p class="reason" id="reason">ALL READINGS WITHIN YOUR NORMAL</p>
          <button class="em-btn accept ok-btn" id="btnOk" type="button" hidden>I'M OK</button>
        </section>

        <section class="card ecg">
          <h2>LIVE ECG</h2>
          <svg viewBox="0 0 300 70">
            <line x1="0" x2="300" y1="48" y2="48" class="base"/>
            <polyline id="trace" class="trace" points=""/>
            <circle id="tip" r="3.5" class="tip" cx="299" cy="48"/>
          </svg>
        </section>

        <div class="mini-row">
          <section class="card mini">
            <h2>OXYGEN</h2>
            <div class="val"><span id="spo2">98</span><small>%</small></div>
          </section>
          <section class="card mini">
            <h2>SLEEP</h2>
            <div class="val"><span id="sleep">7.1</span><small>HRS</small></div>
          </section>
        </div>

        <section class="card notes">
          <h2>ADD A NOTE</h2>
          <textarea id="noteText" maxlength="300" placeholder="WRITE ANYTHING ELSE YOU FEEL..."></textarea>
          <div class="note-row">
            <span id="noteCount">0 / 300</span>
            <button class="em-btn accept" id="btnNote" type="button">SEND</button>
          </div>
          <p class="note-status" id="noteStatus" hidden></p>
        </section>

      </section>

      <!-- Column 2: check-in, suggested cards, log -->
      <section class="col">

        <section class="card checkin">
          <h2>HOW DO YOU FEEL?</h2>
          <div id="groups"></div>
        </section>

        <div class="alert-list" id="alertList" hidden></div>

        <section class="card log" id="logBox" hidden>
          <h2>LOG</h2>
          <div id="logList"></div>
        </section>

      </section>
    </div>

    <div class="toast" id="toast" hidden></div>
  </main>

  <!-- Earth station: the right half of the screen -->
  <aside class="earth-station">
    <header class="es-bar">
      <div class="es-title">EARTH STATION · FLIGHT SURGEON</div>
      <div class="badge">SIMULATED DATA</div>
    </header>

    <section class="card es-summary" id="esSummary"></section>

    <div class="es-grid" id="esGrid"></div>
  </aside>

  <!-- Order matters: cards.js, script.js, earth.js, then live.js -->
  <script src="cards.js"></script>
  <script src="script.js"></script>
  <script src="earth.js"></script>
  <script src="live.js"></script>
</body>
</html>
